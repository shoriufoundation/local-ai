<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Local AI powered by OpenRouter and NVIDIA Nemotron — Shoriu Foundation.">

  <title>Local AI | Shoriu Foundation</title>

  <style>
    :root {
      --bg: #0b0d10;
      --surface: #111419;
      --surface-2: #171a20;
      --surface-3: #1c2027;
      --border: #272c34;
      --text: #f1f3f5;
      --text-secondary: #a6adb8;
      --text-muted: #6f7783;
      --accent: #e5e7eb;
      --accent-hover: #ffffff;
      --user: #252a32;
      --success: #45c48b;
      --danger: #ef6b73;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    /* ------------------------------
       Application
    ------------------------------ */

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ------------------------------
       Header
    ------------------------------ */

    .header {
      height: 64px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      background: rgba(11, 13, 16, 0.94);
      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--surface-2);

      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .model-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--text-secondary);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(69, 196, 139, 0.08);
    }

    .model-badge {
      padding: 6px 10px;

      border: 1px solid var(--border);
      border-radius: 7px;

      background: var(--surface);

      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
    }

    /* ------------------------------
       Chat
    ------------------------------ */

    .chat-wrapper {
      flex: 1;
      min-height: 0;

      display: flex;
      justify-content: center;
    }

    .chat-box {
      width: 100%;
      max-width: 900px;

      padding: 32px 24px 24px;

      overflow-y: auto;
      scroll-behavior: smooth;

      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .chat-box::-webkit-scrollbar {
      width: 6px;
    }

    .chat-box::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    /* ------------------------------
       Welcome
    ------------------------------ */

    .welcome {
      min-height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 40px 20px;
    }

    .welcome-mark {
      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 20px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--surface);

      font-size: 18px;
      font-weight: 700;
    }

    .welcome h1 {
      margin-bottom: 10px;

      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.8px;
    }

    .welcome p {
      max-width: 500px;

      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    .welcome-meta {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-top: 20px;

      color: var(--text-muted);
      font-size: 11px;
    }

    .welcome-meta span {
      width: 3px;
      height: 3px;

      border-radius: 50%;
      background: var(--text-muted);
    }

    /* ------------------------------
       Messages
    ------------------------------ */

    .message {
      display: flex;
      width: 100%;
      margin-bottom: 24px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 78%;

      padding: 13px 16px;

      border-radius: 10px;

      font-size: 14px;
      line-height: 1.65;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .message-content {
      background: var(--user);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-right-radius: 3px;
    }

    .message.ai .message-content {
      background: transparent;
      border: 0;
      color: #d7dbe0;
      padding-left: 0;
      border-bottom-left-radius: 3px;
    }

    .message-label {
      margin-bottom: 6px;

      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    /* ------------------------------
       Loading
    ------------------------------ */

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 18px;
    }

    .typing span {
      width: 5px;
      height: 5px;

      border-radius: 50%;
      background: var(--text-muted);

      animation: typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    /* ------------------------------
       Input
    ------------------------------ */

    .input-section {
      width: 100%;

      display: flex;
      justify-content: center;

      padding: 12px 24px 20px;

      background: linear-gradient(
        to bottom,
        transparent,
        var(--bg) 22%
      );
    }

    .input-wrapper {
      width: 100%;
      max-width: 900px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 6px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: #3a414c;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.025);
    }

    .input-wrapper input {
      flex: 1;
      min-width: 0;

      height: 42px;

      padding: 0 12px;

      background: transparent;
      border: 0;
      outline: 0;

      color: var(--text);
      font-size: 14px;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
    }

    .send-button {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 8px;

      background: var(--accent);
      color: #101216;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .send-button:hover {
      background: var(--accent-hover);
    }

    .send-button:active {
      transform: scale(0.95);
    }

    .send-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .send-button svg {
      width: 17px;
      height: 17px;
    }

    /* ------------------------------
       Footer
    ------------------------------ */

    .footer {
      text-align: center;
      padding: 0 20px 10px;

      color: var(--text-muted);
      font-size: 10px;
    }

    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text);
    }

    /* ------------------------------
       Error
    ------------------------------ */

    .error {
      color: var(--danger) !important;
    }

    /* ------------------------------
       Mobile
    ------------------------------ */

    @media (max-width: 600px) {
      .header {
        height: 58px;
        min-height: 58px;
        padding: 0 14px;
      }

      .brand-mark {
        width: 31px;
        height: 31px;
      }

      .brand-subtitle {
        display: none;
      }

      .model-info .status {
        display: none;
      }

      .model-badge {
        font-size: 10px;
        padding: 5px 8px;
      }

      .chat-box {
        padding: 24px 16px 16px;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .welcome p {
        font-size: 13px;
      }

      .message-content {
        max-width: 88%;
        font-size: 14px;
      }

      .input-section {
        padding: 8px 12px 12px;
      }

      .footer {
        padding-bottom: 7px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="header">

      <div class="brand">
        <div class="brand-mark">AI</div>

        <div class="brand-info">
          <div class="brand-name">Local AI</div>
          <div class="brand-subtitle">Shoriu Foundation</div>
        </div>
      </div>

      <div class="model-info">

        <div class="status">
          <span class="status-dot"></span>
          <span>Online</span>
        </div>

        <div class="model-badge">
          NVIDIA Nemotron
        </div>

      </div>

    </header>


    <!-- Chat -->
    <section class="chat-wrapper">

      <div class="chat-box" id="chatBox">

        <div class="welcome" id="welcome">

          <div class="welcome-mark">AI</div>

          <h1>How can I assist you?</h1>

          <p>
            Local AI provides an AI-powered conversational interface
            using OpenRouter and NVIDIA Nemotron.
          </p>

          <div class="welcome-meta">
            <span>OpenRouter</span>
            <span></span>
            <span>NVIDIA Nemotron</span>
          </div>

        </div>

      </div>

    </section>


    <!-- Input -->
    <section class="input-section">

      <div class="input-wrapper">

        <input
          type="text"
          id="userInput"
          placeholder="Message Local AI..."
          autocomplete="off"
          aria-label="Message Local AI"
        >

        <button
          class="send-button"
          id="sendButton"
          type="button"
          aria-label="Send message"
          onclick="sendMessage()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 2 11 13"></path>
            <path d="m22 2-7 20-4-9-9-4Z"></path>
          </svg>
        </button>

      </div>

    </section>


    <!-- Footer -->
    <footer class="footer">
      Local AI · Powered by
      <a
        href="https://shoriufoundation.org.az"
        target="_blank"
        rel="noopener noreferrer"
      >
        Shoriu Foundation
      </a>
    </footer>

  </main>


  <script>
    const chatBox = document.getElementById("chatBox");
    const welcome = document.getElementById("welcome");
    const input = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");

    let isSending = false;


    /*
     * Load conversation history
     */
    window.addEventListener("DOMContentLoaded", loadHistory);


    async function loadHistory() {
      try {
        const response = await fetch("/api/history");
        const history = await response.json();

        if (!response.ok || !Array.isArray(history)) {
          return;
        }

        if (history.length === 0) {
          return;
        }

        if (welcome) {
          welcome.remove();
        }

        history.forEach(message => {
          if (!message || !message.content) {
            return;
          }

          const role =
            message.role === "user"
              ? "user"
              : "ai";

          appendMessage(
            message.content,
            role,
            false
          );
        });

        scrollToBottom();

      } catch (error) {
        console.error(
          "Unable to load conversation history:",
          error
        );
      }
    }


    /*
     * Send message
     */
    async function sendMessage() {
      if (isSending) {
        return;
      }

      const text = input.value.trim();

      if (!text) {
        return;
      }

      if (welcome) {
        welcome.remove();
      }

      appendMessage(text, "user");

      input.value = "";
      input.focus();

      isSending = true;
      sendButton.disabled = true;

      const loadingMessage = appendLoadingMessage();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        loadingMessage.remove();

        if (!response.ok) {
          appendMessage(
            data?.error ||
            "The request could not be completed. Please try again.",
            "ai error"
          );

          return;
        }

        appendMessage(
          data.reply ||
          "No response was returned.",
          "ai"
        );

      } catch (error) {

        loadingMessage.remove();

        appendMessage(
          "Unable to connect to the AI service. Please check the server and try again.",
          "ai error"
        );

        console.error(
          "Chat request failed:",
          error
        );

      } finally {
        isSending = false;
        sendButton.disabled = false;
        input.focus();
        scrollToBottom();
      }
    }


    /*
     * Create a message
     */
    function appendMessage(
      text,
      role,
      scroll = true
    ) {
      const wrapper = document.createElement("div");

      wrapper.className =
        `message ${role}`;

      const inner = document.createElement("div");

      inner.className = "message-content";

      inner.textContent = text;

      wrapper.appendChild(inner);

      chatBox.appendChild(wrapper);

      if (scroll) {
        scrollToBottom();
      }

      return wrapper;
    }


    /*
     * Loading indicator
     */
    function appendLoadingMessage() {
      const wrapper = document.createElement("div");

      wrapper.className = "message ai";

      wrapper.innerHTML = `
        <div class="message-content">
          <div class="message-label">Local AI</div>

          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;

      chatBox.appendChild(wrapper);

      scrollToBottom();

      return wrapper;
    }


    /*
     * Scroll chat to bottom
     */
    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }


    /*
     * Enter = send
     */
    input.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
